name: Precompiled macOS release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release tag and architecture
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
      - name: Regression checks
        run: |
          scripts/check-resources.sh
          scripts/test.sh
          swift run -c release mirror-selftest
      - name: Build precompiled app
        run: |
          scripts/build-app.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/Android Mirroring.app/Contents/Info.plist")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Package and validate ZIP and DMG
        run: scripts/package-release.sh --no-build
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Android Mirroring ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            build/Android-Mirroring-*.dmg build/Android-Mirroring-*.dmg.sha256 \
            build/Android-Mirroring-*.zip build/Android-Mirroring-*.zip.sha256
